name: 05 - Matrix Lab

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: Build ${{ matrix.os }} - ${{ matrix.configuration }}
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                configuration: [Debug, Release]

        steps:
            - name: Secure Checkout
              uses: $/.github/actions/secure-checkout

            - name: Setup .NET 10
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
              with:
                  dotnet-version: "10.0.x"

            - name: Restore
              run: dotnet restore GithubActionsDemo.slnx

            - name: Build
              run: dotnet build GithubActionsDemo.slnx --configuration ${{ matrix.configuration }} --no-restore

            - name: Test
              run: dotnet test GithubActionsDemo.slnx --configuration ${{ matrix.configuration }} --no-build
