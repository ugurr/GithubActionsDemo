name: 19 - Secrets and Variables Lab

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    inspect-configuration:
        name: Inspect Secrets and Variables
        runs-on: ubuntu-latest

        env:
            SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}

        steps:
            - name: Show non-sensitive configuration
              run: |
                  echo "Repository: ${{ github.repository }}"
                  echo "Sonar project key: $SONAR_PROJECT_KEY"

            - name: Check secret availability without revealing it
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: |
                  if [[ -n "$SONAR_TOKEN" ]]; then
                    echo "SONAR_TOKEN is available."
                  else
                    echo "::error::SONAR_TOKEN is missing."
                    exit 1
                  fi

            - name: Summarize security boundary
              run: |
                  echo "Non-sensitive configuration can be displayed."
                  echo "Secret values must not be printed or uploaded."
                  echo "Secrets should only be passed to steps that need them."
