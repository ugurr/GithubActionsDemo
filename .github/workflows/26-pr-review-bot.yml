name: PR Review Bot

on:
    pull_request_target:
        types: [opened, reopened, synchronize, ready_for_review]
        branches: [main]

permissions: {}

concurrency:
    group: pr-review-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    review:
        name: Review PR Changes
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        timeout-minutes: 5

        permissions:
            pull-requests: write
            issues: write

        steps:
            - name: Inspect PR and Publish Review Comment
              uses: actions/github-script@v7
              with:
                  github-token: ${{ github.token }}
                  script: |
                      const owner = context.repo.owner;
                      const repo = context.repo.repo;
                      const prNumber = context.issue.number;
                      const marker = '<!-- github-actions-review-bot -->';

                      // Retrieve pull request metadata.
                      const { data: pr } = await github.rest.pulls.get({
                        owner,
                        repo,
                        pull_number: prNumber
                      });

                      // Fetch all changed files using pagination.
                      const files = await github.paginate(
                        github.rest.pulls.listFiles,
                        {
                          owner,
                          repo,
                          pull_number: prNumber,
                          per_page: 100
                        }
                      );

                      const findings = [];

                      // Analyze added lines without executing PR code.
                      for (const file of files) {
                        const patch = file.patch || '';

                        const addedLines = patch
                          .split('\n')
                          .filter(line =>
                            line.startsWith('+') &&
                            !line.startsWith('+++')
                          );

                        // Detect unfinished tasks.
                        if (addedLines.some(line =>
                          /\b(TODO|FIXME)\b/.test(line)
                        )) {
                          findings.push(
                            `- ⚠️ **${file.filename}**: TODO/FIXME found. Ensure unfinished work is tracked or resolved.`
                          );
                        }

                        // Detect direct console logging.
                        if (addedLines.some(line =>
                          /Console\.WriteLine\s*\(/.test(line)
                        )) {
                          findings.push(
                            `- ⚠️ **${file.filename}**: Console.WriteLine detected. Consider using ILogger<T> for application logging.`
                          );
                        }

                        // Detect potentially hardcoded passwords.
                        if (addedLines.some(line =>
                          /Password\s*=\s*"/i.test(line)
                        )) {
                          findings.push(
                            `- 🚨 **${file.filename}**: Potential hardcoded password detected. Use secure configuration or a secrets manager.`
                          );
                        }
                      }

                      // Generate a summary of the findings.
                      const result = findings.length
                        ? findings.slice(0, 20).join('\n')
                        : '✅ No issues detected by the configured review rules.';

                      const body = [
                        marker,
                        '## 🤖 Automated PR Review',
                        '',
                        `**Reviewed commit:** \`${pr.head.sha}\``,
                        `**Changed files:** ${files.length}`,
                        '',
                        '### Findings',
                        result,
                        '',
                        '---',
                        '_This is a rule-based review, not an AI analysis or a comprehensive security audit._'
                      ].join('\n');

                      // Retrieve existing PR conversation comments.
                      const comments = await github.paginate(
                        github.rest.issues.listComments,
                        {
                          owner,
                          repo,
                          issue_number: prNumber,
                          per_page: 100
                        }
                      );

                      // Find a previous comment created by this bot.
                      const previous = comments.find(comment =>
                        comment.user?.login === 'github-actions[bot]' &&
                        comment.body?.includes(marker)
                      );

                      // Update an existing comment to avoid duplicates.
                      if (previous) {
                        await github.rest.issues.updateComment({
                          owner,
                          repo,
                          comment_id: previous.id,
                          body
                        });

                        core.info('Existing review comment updated.');
                      } else {
                        await github.rest.issues.createComment({
                          owner,
                          repo,
                          issue_number: prNumber,
                          body
                        });

                        core.info('New review comment created.');
                      }
