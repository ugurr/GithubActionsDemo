name: 24 - Docker Build and GHCR

on:
    pull_request:
        branches: [main]
        paths:
            - "Dockerfile"
            - ".dockerignore"
            - "src/GithubActionsDemo.Web/**"
            - ".github/workflows/24-docker-ghcr.yml"

    push:
        branches: [main]

    workflow_dispatch:

permissions:
    contents: read

jobs:
    docker-smoke-test:
        name: Docker Build and Smoke Test
        runs-on: ubuntu-latest

        steps:
            - name: Secure Checkout
              uses: $/.github/actions/secure-checkout

            - name: Build Docker image
              run: |
                  docker build \
                  --build-arg APP_VERSION="$GITHUB_SHA" \
                  -t github-actions-demo:ci \
                  .

            - name: Start container
              run: |
                  docker run -d \
                    --name github-actions-demo-test \
                    -p 8080:8080 \
                    github-actions-demo:ci

            - name: Verify HTTP response
              run: |
                  for attempt in {1..15}; do
                    echo "Smoke test attempt $attempt/15"

                    if curl --fail --silent \
                      http://localhost:8080/ > /dev/null; then
                      echo "Container smoke test PASSED."
                      exit 0
                    fi

                    sleep 2
                  done

                  docker logs github-actions-demo-test
                  exit 1

            - name: Stop container
              if: always()
              run: docker rm -f github-actions-demo-test || true

    publish-ghcr:
        name: Publish Image to GHCR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        needs: docker-smoke-test
        runs-on: ubuntu-latest

        outputs:
            image: ${{ steps.image-digest.outputs.image }}
            digest: ${{ steps.image-digest.outputs.digest }}
            image-ref: ${{ steps.image-digest.outputs.image-ref }}

        permissions:
            contents: read
            packages: write
            id-token: write
            attestations: write

        steps:
            - name: Secure Checkout
              uses: $/.github/actions/secure-checkout

            - name: Login to GitHub Container Registry
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  echo "$GH_TOKEN" | docker login ghcr.io \
                    -u "${{ github.actor }}" \
                    --password-stdin

            - name: Build and tag image
              id: build-container-image
              env:
                  REPOSITORY: ${{ github.repository }}
                  COMMIT_SHA: ${{ github.sha }}
              run: |
                  IMAGE="ghcr.io/${REPOSITORY,,}"

                  docker build \
                    --build-arg APP_VERSION="$GITHUB_SHA" \
                    -t "$IMAGE:latest" \
                    -t "$IMAGE:sha-${COMMIT_SHA:0:12}" \
                    .

                  echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

            - name: Push image to GHCR
              env:
                  IMAGE: ${{ steps.build-container-image.outputs.image }}
              run: |
                  docker push "$IMAGE:latest"
                  docker push "$IMAGE:sha-${GITHUB_SHA:0:12}"

            - name: Resolve pushed image digest
              id: image-digest
              shell: bash
              env:
                  IMAGE: ${{ steps.build-container-image.outputs.image }}
              run: |
                  set -euo pipefail

                  TAG="sha-${GITHUB_SHA:0:12}"

                  DIGEST=$(docker buildx imagetools inspect \
                    "$IMAGE:$TAG" \
                    --format '{{.Manifest.Digest}}')

                  if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                    echo "::error::Invalid image digest: $DIGEST"
                    exit 1
                  fi

                  {
                    echo "image=$IMAGE"
                    echo "digest=$DIGEST"
                    echo "image-ref=$IMAGE@$DIGEST"
                  } >> "$GITHUB_OUTPUT"

                  echo "Published image: $IMAGE@$DIGEST"

            - name: Generate Docker SBOM
              uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
              with:
                  image: ${{ steps.image-digest.outputs.image-ref }}
                  format: spdx-json
                  artifact-name: docker-sbom.spdx.json
                  output-file: docker-sbom.spdx.json

            - name: Attest Docker image provenance
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
              with:
                  subject-name: ${{ steps.image-digest.outputs.image }}
                  subject-digest: ${{ steps.image-digest.outputs.digest }}
                  push-to-registry: true

    deploy-render:
        name: Deploy to Render
        needs: publish-ghcr
        runs-on: ubuntu-latest

        permissions: {}

        concurrency:
            group: production-deployment
            cancel-in-progress: false

        environment:
            name: production
            url: ${{ vars.RENDER_SERVICE_URL }}

        steps:
            - name: Trigger Render deployment
              id: trigger-render-deployment
              env:
                  RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
                  IMAGE_REF: ${{ needs.publish-ghcr.outputs.image-ref }}
              shell: bash
              run: |
                  if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
                      echo "::error::RENDER_DEPLOY_HOOK_URL is missing"
                      exit 1
                  fi

                  IMAGE_URL=$(IMAGE_URL="$IMAGE_REF" python3 -c \
                    'import os, urllib.parse; print(urllib.parse.quote(os.environ["IMAGE_URL"], safe=""))')

                  SEPARATOR="?"
                  [[ "$RENDER_DEPLOY_HOOK_URL" == *"?"* ]] && SEPARATOR="&"

                  curl --fail --silent --show-error \
                      --request POST \
                      "${RENDER_DEPLOY_HOOK_URL}${SEPARATOR}imgURL=${IMAGE_URL}"

                  echo "Render deployment request submitted for $IMAGE_REF"

            - name: Verify deployed commit SHA
              env:
                  SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
                  EXPECTED_SHA: ${{ github.sha }}
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ ! "$IMAGE_REF" =~ ^ghcr\.io/ugurr/githubactionsdemo@sha256:[0-9a-f]{64}$ ]]; then
                    echo "::error::Invalid immutable image reference"
                    exit 1
                  fi

                  if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
                    echo "::error::RENDER_DEPLOY_HOOK_URL is missing"
                    exit 1
                  fi

                  echo "Expected SHA: $EXPECTED_SHA"

                  for attempt in {1..40}; do
                    echo "Verification attempt $attempt/40"

                    if RESPONSE=$(curl \
                      --fail \
                      --silent \
                      --show-error \
                      --max-time 10 \
                      "${SERVICE_URL%/}/version"); then

                      ACTUAL_SHA=$(jq -r \
                        '.version // .Version // empty' \
                        <<< "$RESPONSE" 2>/dev/null || true)

                      echo "Actual SHA: ${ACTUAL_SHA:-unavailable}"

                      if [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]]; then
                        echo "Production deployment verified successfully."
                        exit 0
                      fi
                    fi

                    if [[ "$attempt" -lt 40 ]]; then
                      sleep 15
                    fi
                  done

                  echo "::error::Production version did not match expected commit SHA"
                  exit 1
