name: 16 - .NET Code Coverage

on:
    push:
        branches: [main]
        paths:
            - "src/**"
            - "tests/**"
            - ".github/workflows/16-dotnet-code-coverage.yml"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test-and-coverage:
        name: xUnit Tests and Coverage
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Verify .NET SDK
              run: dotnet --version

            - name: Restore locked dependencies
              run: dotnet restore GithubActionsDemo.slnx --locked-mode

            - name: Build solution
              run: >
                  dotnet build GithubActionsDemo.slnx
                  --configuration Release
                  --no-restore

            - name: Run xUnit tests with coverage
              run: >
                  dotnet test tests/GithubActionsDemo.Tests/GithubActionsDemo.Tests.csproj
                  --configuration Release
                  --no-build
                  --collect:"XPlat Code Coverage;Format=cobertura,opencover"
                  --logger "trx;LogFileName=unit-tests.trx"
                  --results-directory ./TestResults

            - name: Upload test and coverage reports
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: dotnet-test-coverage-${{ github.run_number }}
                  path: TestResults/
                  if-no-files-found: error

            - name: Generate HTML coverage report
              if: ${{ !cancelled() }}
              uses: danielpalme/ReportGenerator-GitHub-Action@v5
              with:
                  reports: "TestResults/**/coverage.cobertura.xml"
                  targetdir: "CoverageReport"
                  reporttypes: "Html;HtmlSummary"

            - name: Upload readable coverage report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: dotnet-coverage-html
                  path: CoverageReport/
                  if-no-files-found: error

    coverage-quality-gate:
        name: Validate 80 Percent Line Coverage
        needs: test-and-coverage
        runs-on: ubuntu-latest

        steps:
            - name: Download Cobertura coverage report
              uses: actions/download-artifact@v4
              with:
                  name: dotnet-test-coverage-${{ github.run_number }}
                  path: ./coverage-data

            - name: Validate line coverage threshold
              env:
                  MIN_LINE_COVERAGE: "80"
              run: |
                  python3 - <<'PY'
                  import glob
                  import os
                  import sys
                  import xml.etree.ElementTree as ET

                  files = glob.glob("coverage-data/**/coverage.cobertura.xml", recursive=True)
                  if not files:
                      sys.exit("Cobertura coverage report not found")

                  root = ET.parse(files[0]).getroot()
                  actual = float(root.attrib["line-rate"]) * 100
                  minimum = float(os.environ["MIN_LINE_COVERAGE"])

                  print(f"Actual line coverage: {actual:.2f}%")
                  print(f"Required line coverage: {minimum:.2f}%")

                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                      summary.write(f"## Coverage Quality Gate\n\n")
                      summary.write(f"- Actual: {actual:.2f}%\n")
                      summary.write(f"- Required: {minimum:.2f}%\n")
                      summary.write(f"- Result: {'PASS' if actual >= minimum else 'FAIL'}\n")

                  if actual < minimum:
                      sys.exit("Coverage quality gate failed")
                  PY
