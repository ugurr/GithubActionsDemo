name: 34 - Final CI Challenge

on:
    workflow_dispatch:
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    build:
        name: Build and Test Application
        runs-on: ubuntu-latest

        steps:
            - name: Secure Checkout
              uses: $/.github/actions/secure-checkout

            - name: Setup .NET
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
              with:
                  dotnet-version: "10.0.x"

            - name: Restore
              run: dotnet restore GithubActionsDemo.slnx

            - name: Build
              id: build
              run: dotnet build GithubActionsDemo.slnx -c Release --no-restore

            - name: Run Tests
              id: test
              if: ${{ steps.build.outcome == 'success' }}
              run: |
                  dotnet test GithubActionsDemo.slnx \
                    -c Release \
                    --no-build \
                    --no-restore \
                    --logger "trx;LogFileName=unit-tests.trx" \
                    --results-directory ./TestResults

            - name: Upload Test Results
              if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: test-results
                  path: TestResults/
                  if-no-files-found: error
