name: 02 - .NET CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build-and-test:
        name: Build and Test .NET 10
        runs-on: ubuntu-latest

        steps:
            - name: Secure Checkout
              uses: $/.github/actions/secure-checkout

            - name: Inspect preinstalled .NET SDKs
              run: |
                  dotnet --list-sdks
                  dotnet --list-runtimes

            - name: Setup .NET
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
              with:
                  dotnet-version: "10.0.x"

            - name: Show SDK version
              run: dotnet --version

            - name: Restore dependencies
              run: dotnet restore GithubActionsDemo.slnx

            - name: Build solution
              run: dotnet build GithubActionsDemo.slnx --no-restore --configuration Release

            - name: Run unit tests
              run: |
                  dotnet test GithubActionsDemo.slnx \
                  --no-restore \
                  --configuration Release \
                  --logger "trx;LogFileName=unit-tests.trx" \
                  --results-directory ./TestResults

            - name: Runs only after success
              if: ${{ success() }}
              run: echo "Previous steps succeeded."

            - name: Runs when a step fails
              if: ${{ failure() }}
              run: echo "A previous step failed."

            - name: Inspect test results
              if: ${{ always() }}
              run: |
                  echo "Inspecting test results..."
                  if [ -d TestResults ]; then
                    ls -la TestResults
                  else
                    echo "TestResults directory not found."
                  fi

            - name: Upload test results
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: unit-test-results
                  path: TestResults/
                  if-no-files-found: warn
