name: 02 - .NET CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    dotnet-ci:
        name: Call Reusable .NET CI
        uses: $/.github/workflows/32-reusable-dotnet-ci.yml
        with:
            dotnet-version: "10.0.x"
            build-configuration: "Release"
