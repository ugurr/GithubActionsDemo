name: 14 - Reusable .NET CI

on:
    workflow_call:
        inputs:
            solution-path:
                description: Solution or project path
                required: true
                type: string

            dotnet-version:
                description: .NET SDK version
                required: false
                default: "10.0.x"
                type: string

        outputs:
            build-result:
                description: Result of the .NET CI job
                value: ${{ jobs.dotnet-ci.outputs.build-result }}
permissions:
    contents: read

jobs:
    dotnet-ci:
        name: Reusable Build and Test
        runs-on: ubuntu-latest

        outputs:
            build-result: ${{ steps.report-ci-result.outputs.result }}

        steps:
            - name: Secure Checkout
              uses: $/.github/actions/secure-checkout

            - name: Verify preinstalled .NET SDK
              run: |
                  dotnet --list-sdks
                  dotnet --version

            - name: Restore dependencies
              run: dotnet restore "${{ inputs.solution-path }}" --locked-mode

            - name: Build solution
              run: >
                  dotnet build "${{ inputs.solution-path }}"
                  --configuration Release
                  --no-restore

            - name: Run unit tests
              run: >
                  dotnet test "${{ inputs.solution-path }}"
                  --configuration Release
                  --no-build

            - name: Export CI result
              id: report-ci-result
              run: echo "result=passed" >> "$GITHUB_OUTPUT"
